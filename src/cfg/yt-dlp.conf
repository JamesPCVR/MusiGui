# Download best available audio stream
--format "bestaudio/best"

# Extract audio only
--extract-audio
--audio-format mp3
--audio-quality 0

# Add metadata (including cover image)
--embed-metadata
--add-metadata
--embed-thumbnail
--convert-thumbnails jpg

# Most of this is just to fix the title and album name
--parse-metadata "%(track,title)s:%(meta_title)s" # Title
--parse-metadata "%(album,meta_title)s:%(meta_album)s" # Album

# Unicode normalisation
--replace-in-metadata meta_title "[\uFF08\uFF3B\uFF5B\u3008\u300A\u300C\u300E\u3010\u3014\uFE59\uFE5B\uFE5D\uFE35]" "(" # Left brackets
--replace-in-metadata meta_title "[\uFF09\uFF3D\uFF5D\u3009\u300B\u300D\u300F\u3011\u3015\uFE5A\uFE5C\uFE5E\uFE36]" ")" # Right brackets
--replace-in-metadata meta_title "[\u02BB\u2018\u2019\u2032\u201C\u201D\u201F]" "'" # Quotes (double quotes not allowed in windows path)
--replace-in-metadata meta_title "[\u060C\u201A\u3001\uFE10\uFE50\uFE51\uFF0C\uFF64]" "," # Commas
--replace-in-metadata meta_album "[\uFF08\uFF3B\uFF5B\u3008\u300A\u300C\u300E\u3010\u3014\uFE59\uFE5B\uFE5D\uFE35]" "(" # Left brackets
--replace-in-metadata meta_album "[\uFF09\uFF3D\uFF5D\u3009\u300B\u300D\u300F\u3011\u3015\uFE5A\uFE5C\uFE5E\uFE36]" ")" # Right brackets
--replace-in-metadata meta_album "[\u02BB\u2018\u2019\u2032\u201C\u201D\u201F]" "'" # Quotes (double quotes not allowed in windows path)
--replace-in-metadata meta_album "[\u060C\u201A\u3001\uFE10\uFE50\uFE51\uFF0C\uFF64]" "," # Commas

# If the artist name is in the title split it at a dash or colon
--replace-in-metadata meta_title "^(?:%(artist)s|%(artists.0)s)\s*[\u002D\u2013\u2014\u003A]\s*" ""

# Preserve remix information (force square brackets)
--replace-in-metadata meta_title "(?i)\s*\(([^)]*(?:remix|mix|edit|vip|version|bootleg|rework|by\s+[^)]*)[^)]*)\)" " [\1]"
--replace-in-metadata meta_title "(?i)\s*\[([^]]*(?:remix|mix|edit|vip|version|bootleg|rework|by\s+[^]]*)[^]]*)\]" " [\1]"

# Remove other bracketed junk, a lot of it is kept in metadata
# --replace-in-metadata meta_title "(?i)\([^)]*\b(?:ft\.?|feat\.?|featuring|with)\b[^)]*\)" "" # Collaboration
# --replace-in-metadata meta_title "(?i)\([^)]*\b(?:official|video|audio|visualizer|mv|pv)\b[^)]*\)" "" # Release status
# --replace-in-metadata meta_title "(?i)\([^)]*\b(?:commission(?:ed|s)?|comission(?:ed|s)?)\b[^)]*\)" "" # Comissioned works
# ALTERNATIVELY: Nuke the brackets
--replace-in-metadata meta_title "(\(.*\))" ""
--replace-in-metadata meta_album "(\(.*\))" ""

# Clean out whitespace
--replace-in-metadata meta_title "\s{2,}" " "
--replace-in-metadata meta_title "\s+\]" "]"
--replace-in-metadata meta_title "\s+$" ""
--replace-in-metadata meta_album "\s{2,}" " "
--replace-in-metadata meta_album "\s+\]" "]"
--replace-in-metadata meta_album "\s+$" ""

# now the titles diverge, one for filename, one for title
--parse-metadata "%(meta_title)s:%(file_title)s"

# Nuke it from orbit, only basic ascii allowed, everything else gone
--replace-in-metadata file_title "[^ !#%&'()+,\-.0-9;=?@A-Z\[\]^_`a-z{}]" "" # windows path safe
--replace-in-metadata meta_title "[^\x20-\x7E]" "" # only printable ascii
--replace-in-metadata meta_album "[^\x20-\x7E]" "" # only printable ascii

# Pick out the information from the inconsistencies
--parse-metadata "%(artist,creator,artists.0,uploader|Unknown)s:%(meta_artist)s" # Artist
--parse-metadata "%(album_artist,creator,artists.0,uploader)s:%(meta_album_artist)s" # Album artist
--parse-metadata "%(upload_date>%Y-%m-%d)s:%(meta_date)s" # Date
--parse-metadata "%(track_number,playlist_index|1)s:%(meta_track)s" # Track number
--parse-metadata "%(genre,genres.0,tags.0)s:%(meta_genre)s" # Genre
--parse-metadata "%(playlist_webpage_url,webpage_url)s:%(meta_SOURCE)s" # Source

# Remove some fields
# --parse-metadata "description:(?s)(?P<meta_description>.+)" # Parse description
--parse-metadata ":(?P<meta_description>)" # Remove description
--parse-metadata ":(?P<meta_synopsis>)" # Remove synopsis
--parse-metadata ":(?P<meta_comment>)" # Remove comment

# Some cleanup
--replace-in-metadata meta_genre "^([^;&+,]+)" "\1" # Only the first genre